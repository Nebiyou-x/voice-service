version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tts_redis_cache
    ports:
      - "6379:6379"
    restart: always

  tts-service:
    build: .
    container_name: amharic_tts_service
    ports:
      - "8000:8000"
    environment:
      - USE_CUDA=1
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    restart: always