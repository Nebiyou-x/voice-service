[Unit]
Description=Lersha Amharic Voice Synthesis FastAPI Microservice
After=network-online.target redis-server.service
Wants=network-online.target
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Type=simple
User=ubuntu
Group=ubuntu
WorkingDirectory=/path/to/lersha-voice-service
ExecStart=/path/to/lersha-voice-service/venv/bin/uvicorn main:app \
    --host 0.0.0.0 --port 8000 --workers 1 \
    --timeout-keep-alive 75
ExecReload=/bin/kill -HUP $MAINPID
Restart=on-failure
RestartSec=5
TimeoutStartSec=180
TimeoutStopSec=30
KillSignal=SIGTERM

Environment="PATH=/path/to/lersha-voice-service/venv/bin:/usr/bin"
Environment="PYTHONUNBUFFERED=1"
Environment="PYTHONDONTWRITEBYTECODE=1"
Environment="USE_CUDA=1"
Environment="CUDA_VISIBLE_DEVICES=0"
Environment="CUDA_CACHE_PATH=/var/cache/lersha-voice/cuda"
Environment="REDIS_URL=redis://localhost:6379"

# Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=lersha-voice

# Hardening
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/path/to/lersha-voice-service /var/cache/lersha-voice

[Install]
WantedBy=multi-user.target